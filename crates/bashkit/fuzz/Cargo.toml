# Fuzz testing for Bashkit parser
# Run with: cargo +nightly fuzz run parser_fuzz
# See knowledge/security/threat-model.md for security context

[package]
name = "bashkit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt"] }

[dependencies.bashkit]
path = ".."
features = ["jq"]

[features]
# CPython (wasm) python3 target; off by default so `cargo fuzz build` stays
# light. Run with: cargo +nightly fuzz run cpython_fuzz --features cpython
cpython = ["bashkit/cpython"]
# Monty python3 target (bashkit-monty fork). Run with:
# cargo +nightly fuzz run python_fuzz --features python
python = ["bashkit/python"]
# ZapCode ts target (vendored zapcode_vendor). Run with:
# cargo +nightly fuzz run ts_fuzz --features typescript
typescript = ["bashkit/typescript"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "parser_fuzz"
path = "fuzz_targets/parser_fuzz.rs"
test = false
doc = false
bench = false

