uu_cat = "=0.12.0"
uu_cksum = "=0.12.0"
uu_comm = "=0.12.0"
uu_cp = "=0.12.0"
uu_csplit = "=0.12.0"
uu_cut = "=0.12.0"
uu_date = "=0.12.0"
uu_dd = "=0.12.0"
uu_dir = "=0.12.0"
uu_dircolors = "=0.12.0"
uu_dirname = "=0.12.0"
