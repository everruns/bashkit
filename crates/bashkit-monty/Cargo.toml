# Fork of pydantic/monty monty-1.5.0 (MIT) for bashkit's in-process Python.
#
# Important decision (security): bashkit runs many tenants' Python in one
# process. Upstream Monty enforces `max_memory` through a process-wide
# allocator counter and has no in-VM host checkpoint, so bashkit carries a
# small patch in `bashkit-monty-types` (`set_memory_probe`, pydantic/monty#740,
# and `set_checkpoint_hook`) and republishes `monty` against it. Source is
# upstream monty-1.5.0 unchanged except marked edits; the library names stay `monty` /
# `monty_types` so code reads as upstream. Drop both crates once upstream ships
# the hooks. See knowledge/runtimes/python-builtin.md.
#
# Not formatted or linted as bashkit code: kept byte-identical to upstream
# (rustfmt.toml disables formatting; a crate-level `#![allow]` in lib.rs and
# [lints] allow upstream warnings; upstream tests are not vendored). Every
# local edit is marked with a `bashkit fork:` comment.

[package]
name = "bashkit-monty"
version.workspace = true
edition = "2024"
rust-version = "1.96"
authors = ["Samuel Colvin <samuel@pydantic.dev>", "Everruns"]
license = "MIT"
repository.workspace = true
description = "Fork of pydantic/monty 1.5.0 (secure, snapshotable Python sandbox) built against bashkit-monty-types, for bashkit's python3"
keywords = ["python", "interpreter", "sandbox", "bashkit"]
categories = ["compilers", "emulators"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]

[lib]
name = "monty"
path = "src/lib.rs"
# Upstream tests are not vendored (they need the upstream tests/ tree).
test = false
doctest = false

[dependencies]
monty-types = { package = "bashkit-monty-types", path = "../bashkit-monty-types", version = "0.21.0", features = ["cpu-clock"] }
ahash = { version = "0.8.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
fancy-regex = { version = "0.20.0" }
# bashkit fork: same, aligned with the workspace's 0.4. This does not drop
# 0.3 from the graph (ahash, fastbloom and rand_core still pull it); it stops
# Dependabot re-proposing a fork edit the drift check would reject. Drop the
# marker when upstream Monty reaches 0.4.
getrandom = { version = "0.4" }
hashbrown = { version = "0.16" }
indexmap = { version = "2" }
itertools = { version = "0.14.0" }
itoa = { version = "1" }
# bashkit fork: upstream pins 0.17, whose optional pyo3 is ^0.29.2. The
# Python binding is on pyo3 0.30, and the two collide on links=pyo3-python,
# so cargo cannot resolve the workspace at all. jiter 0.18 moves its pyo3
# requirement to ^0.30.1, which unifies the graph on one major. Smallest
# step that does: 0.19 exists but is not needed. Drop the marker when
# upstream Monty reaches pyo3 0.30.
jiter = { version = "0.18.0", features = ["num-bigint"] }
libm = { version = "0.2" }
memchr = { version = "2.7" }
minicbor-serde = { version = "0.7", features = ["alloc"], default-features = false }
monty-macros = { version = "=1.5.0" }
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = { version = "0.1" }
num-traits = { version = "0.2" }
postcard = { version = "1.1", features = ["alloc"] }
ruff_python_ast = { version = "0.0.14" }
ruff_python_codegen = { version = "0.0.14" }
ruff_python_parser = { version = "0.0.14" }
ruff_python_stdlib = { version = "0.0.14" }
ruff_source_file = { version = "0.0.14" }
ruff_text_size = { version = "0.0.14" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = { version = "0.11" }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
smallvec = { version = "1.13", features = ["serde", "union"] }
speedate = { version = "0.17.0" }
strum = { version = "0.27", features = ["derive", "phf"] }
unicode-general-category = { version = "1" }
unicode-normalization = { version = "0.1" }
unicode_names2 = { version = "1" }

# Upstream's `#[cfg(test)]` modules inside src/ need this; the drift check
# deliberately skips dev-dependencies, and CI's `--workspace --lib` builds the
# lib test target even though `[lib] test = false` excludes it by default.
[dev-dependencies]
serde_json = { version = "1.0" }

[features]
memory-model-checks = []
ref-count-return = ["test-hooks"]
test-hooks = ["monty-types/test-hooks"]

[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"
