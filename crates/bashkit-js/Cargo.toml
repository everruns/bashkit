# Bashkit JavaScript/TypeScript bindings via NAPI-RS
# Version synced from workspace Cargo.toml via build.rs

[package]
name = "bashkit-js"
description = "JavaScript/TypeScript bindings for the Bashkit sandboxed bash interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
bashkit = { path = "../bashkit", features = ["python", "typescript", "realfs", "jq", "interop", "http_client", "sqlite", "terminal"] }
bashkit-scripted-tool = { path = "../bashkit-scripted-tool", features = ["python", "jq"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }

[build-dependencies]
napi-build = { workspace = true }

[features]
# Opt-in checked jq containers; keep production defaults unchanged.
experimental_jq = ["bashkit/experimental_jq"]

# Opt-in script compiler; preserves ordinary Bash syntax and AST fallback.
experimental_execution_plan = ["bashkit/experimental_execution_plan"]
