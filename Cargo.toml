# Bashkit - Awesomely fast virtual sandbox with bash and file system
# Part of the Everruns ecosystem
# See knowledge/ for design decisions

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT"
authors = ["Mykhailo Chalyi <mike@chaliy.name>", "Everruns"]
repository = "https://github.com/everruns/bashkit"
description = "Awesomely fast virtual sandbox with bash and file system"
keywords = ["bash", "virtual", "ai", "agent", "everruns"]
categories = ["command-line-utilities", "parser-implementations"]

[workspace.dependencies]
# Async runtime
# Base features are WASM-compatible; crates needing more (rt-multi-thread, fs, net, process)
# add them in their own Cargo.toml or via [target.'cfg(...)'.dependencies].
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
async-trait = "0.1"
futures-core = "0.3"
# Important decision: `default-features = false`. bashkit uses only `StreamExt`,
# `FutureExt` and `select`/`pin_mut!` (time_compat's wasm timeout). The default
# feature set additionally pulls futures-channel / futures-io / futures-sink /
# slab, none of which bashkit touches.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# JSON processing (jq) - verified embeddable
jaq-core = "3.0"
jaq-std = "3.0"
jaq-json = "2.0"

# HTTP client (for curl and API calls)
# IMPORTANT: rustls-no-provider leaves the backend choice to bashkit, whose
# default (`ring`) keeps the aws-lc-rs C crypto out of the dep tree so we don't
# depend on cross-toolchain glibc headers (e.g. AT_HWCAP2 on aarch64 manylinux).
# The provider is installed at runtime in bashkit::network::client.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
# No crypto backend selected here: bashkit picks one via its `ring` (default)
# / `aws-lc-rs` features; other workspace members enable a backend explicitly.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }

# Regex
regex = "1"
fancy-regex = "0.19"

# Date/Time
# Important decision: `default-features = false` drops chrono's `wasmbind`,
# which routes `Utc::now()` at the JS `Date` on wasm32-unknown-unknown. bashkit
# reads the clock through `time_compat` on every target instead, so the JS
# binding is dead weight for JS hosts and an unresolvable import for non-JS wasm
# embedders. Re-enabled by the bashkit `wasm_js` feature for the JS packages.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

# Compression
flate2 = "1"
bzip2 = { version = "0.6.1", default-features = true }

# Base64 encoding
base64 = "0.23"

# Checksums (md5sum, sha256sum, etc.)
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"

# Ed25519 signing (bot-auth request signing)
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
zeroize = "1"

# CSPRNG for placeholder token generation (security-grade randomness).
# Used by the credential placeholder generator; getrandom is the lowest-level
# CSPRNG primitive and is already transitively in the dep tree via reqwest/rustls.
# Important decision: the JS backend is *not* enabled here. `wasm_js` is a
# feature of the `bashkit` crate instead, because a wasm32-unknown-unknown host
# is not necessarily a JS host: a non-JS embedder (a wasm component in a
# runtime with no JS engine) must be able to supply a custom backend, which the
# unconditional `wasm_js` feature made a compile error.
getrandom = { version = "0.4" }

# Drop-in std::time::{Instant,SystemTime} replacement for wasm32-unknown-unknown,
# where std::time is a hard panic ("time not implemented on this platform" — no
# extension point, see library/std/src/sys/time/unsupported.rs). Backed by
# Performance.now()/Date.now() via web-sys on wasm32; re-exports std::time
# unchanged everywhere else. See crates/bashkit/src/time_compat.rs.
web-time = "1"

# CLI
# Intentionally NOT enabling clap's `env` feature: it makes `Arg::env(...)`
# read defaults from `std::env`, which would tunnel host process state into
# the bashkit sandbox (TM-INF-023). The coreutils-args-port codegen strips
# `.env(...)` chains from vendored Arg builders; dropping the feature here
# is defence-in-depth so any re-introduction fails to compile.
#
# Important decision: `default-features = false`. Dropping clap's `color`
# feature removes anstream / anstyle-query / colorchoice / is_terminal_polyfill,
# and dropping `suggestions` removes strsim -- 7 crates that exist to detect and
# paint a host TTY. Builtins write to the sandbox's virtual stdout, which is
# never a terminal, so clap's colour and did-you-mean machinery is dead weight.
# Consequence: `Command::color(...)` no longer exists; builtins must not call it.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Testing
tokio-test = "0.4"
tempfile = "3"
pretty_assertions = "1"
insta = "1"

# Fault injection (security testing)
fail = "0.5"

# Property-based testing
proptest = "1"

# Logging/tracing
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }

# SSH client (for ssh/scp/sftp builtins)
russh = "0.62"
# Embedded SQLite engine (Turso, pure Rust). Upstream is BETA — gated behind
# the `sqlite` feature and disabled by default; see knowledge/runtimes/sqlite-builtin.md.
turso_core = "0.8.0-pre.1"

# Serial test execution
serial_test = "4"

# Python bindings
# Important decision (PyPI storage): `abi3-py39` builds against CPython's stable
# ABI (limited API), so ONE wheel per platform runs on Python 3.9+ instead of a
# separate binary per minor version. Collapses the 6-version × 7-platform matrix
# (42 native wheels/release, ~12 MB each) to 7, and future Python releases need
# no rebuild. `generate-import-lib` kept for the Windows abi3 import lib.
# See knowledge/runtimes/python-package.md § abi3.
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# JavaScript/Node.js bindings (NAPI-RS)
napi = { version = "3.8.6", default-features = false, features = ["napi6", "compat-mode", "tokio_rt"] }
napi-derive = "3.5.5"
napi-build = "2"

# Important decision: shrink test-binary link memory. `cargo test --all-features`
# statically links every embedded interpreter (monty, zapcode, turso, russh, jaq,
# reqwest+rustls, ed25519-dalek) into each of ~87 integration test binaries; with
# default `debug = "full"` the per-binary debuginfo dominates and the parallel
# link step peaks well above what the cloud sandbox tolerates. Line-tables-only
# keeps backtraces readable (function names + line numbers) while cutting
# per-binary size by 50–80% for big crates. `codegen-units` left at the default
# (16): forcing it to 1 explodes LLVM's per-crate object files on disk and made
# CI's feature-sliced test job run out of space.
[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
# Security: interpreter relies on catch_unwind around builtins.
# Keep release unwinding enabled so panic containment works.
panic = "unwind"
strip = "symbols"

# Important decision: separate `bench` profile uses fat LTO for the most
# aggressive cross-crate inlining. Criterion benches run rarely and we'd
# rather spend extra compile time once than miss inlining opportunities
# across the interpreter / parser / builtins boundary on every measurement.
# `release` keeps `thin` LTO so day-to-day builds stay fast.
[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1

# Important decision (security): pin `jiter` to upstream main so the whole
# workspace can run pyo3 0.29, which fixes GHSA-36hh-v3qg-5jq4 (high, OOB read
# in PyList/PyTuple iterators) and GHSA-chgr-c6px-7xpp (missing `Sync` bound)
# in the bashkit-python extension.
#
# Blocker: `monty 0.0.19` -> `jiter ^0.15.0` and jiter 0.15.0 declares an
# optional `pyo3 = "^0.28.2"` (jiter 0.16.0 moved to pyo3 0.29 but is outside
# monty's range).
# Although jiter's `python` feature is never activated here (monty only enables
# `num-bigint`), the weak `pyo3?/num-bigint` reference plus pyo3-ffi's
# `links = "python"` global uniqueness force the resolver to honour jiter's
# 0.28 constraint, pinning the whole graph below pyo3 0.29.
#
# jiter `main` is still version 0.15.0 (semver-compatible with monty's
# `^0.15.0`) but already bumped its pyo3 dependency to 0.29, so this patch
# unblocks the upgrade without a fork. Drop it once monty ships a release that
# tracks a published jiter with pyo3 0.29.
# Important decision (supply chain): `idna_adapter` is pinned to 1.0.0 in
# Cargo.lock -- a lockfile-only pin, since the crate exists purely so the top
# level can pick `idna`'s Unicode back end (1.2.x = ICU4X, 1.1.x = unicode-rs,
# 1.0.x = no back end). `url` is a mandatory dep (network allowlist matching,
# curl redirect resolution, git remote parsing) and the ICU4X back end drags in
# 21 crates -- icu_normalizer, icu_properties, icu_collections, zerovec, yoke,
# tinystr and friends -- none of which bashkit's URL handling needs.
#
# Consequence: non-ASCII domain names are rejected rather than normalised per
# UTS 46. For a sandbox allowlist that is a hardening win, not a regression: it
# removes the homograph / punycode-confusion class from host matching, and
# allowlist patterns are ASCII.
#
# NOT a binary-size change -- measured at 15 KB (0.16%) on the release
# wasm32 browser build, because LTO already dead-strips the ICU tables. The
# payoff is audit surface (21 fewer crates for `cargo deny` and dependabot),
# ~10% off a cold `cargo check`, and ~70 MB less build output.
#
# Does NOT remove ICU from every configuration: `turso_core` pulls
# `icu_collator`, so any build with the `sqlite` feature keeps the ICU stack.
#
# Restore after a `cargo update` that bumps it:
#     cargo update -p idna_adapter --precise 1.0.0
[patch.crates-io]
jiter = { git = "https://github.com/pydantic/jiter", rev = "6d57715e01ec78859c62fc5447073c0b5902de39" }
