[package]
name = "mixed-plan-loops"
publish = false
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
bashkit = { path = "../../crates/bashkit", features = ["jq", "experimental_plan_benchmark_control"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde_json = "1"
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
