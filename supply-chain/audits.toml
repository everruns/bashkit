[[audits.jiter]]
who = "Mykhailo Chalyi <mike@chaliy.name>"
criteria = "safe-to-deploy"
version = "0.13.0"
importable = false
notes = "Local feature-scoped full source review: default/num-bigint only, with python forbidden by deny.toml (verified all-features graph and negative feature fixture). AArch64 loads require checked 16-byte slices, unchecked next-byte access remains inside the identified non-digit lane, and vector casts preserve initialized sizes. ASCII flags are cleared by non-ASCII bytes/Unicode escapes before unchecked UTF8; partial UTF8 uses validated prefix boundaries. Numeric loops progress and cap big integers at 4300 characters; value parsing limits nesting. No runtime filesystem/network/process access in reviewed features. EXCLUDED: optional Python FFI dereferences PyUnicode_New without checking allocation failure; this audit does not certify that feature. Re-audit before enabling it."

