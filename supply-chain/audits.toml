[[audits.russh]]
who = "Mykhailo Chalyi <mike@chaliy.name>"
criteria = "safe-to-deploy"
delta = "0.63.3 -> 0.64.1"
notes = "Reviewed complete published package diff: no new dependencies, no build scripts, no new host filesystem, network or process access, and no new unsafe blocks anywhere in src. The substantive change is a server-side authentication fix: a publickey request's signature must now use the algorithm the request announced (RFC 4252 section 7, RFC 8332 section 3). Before, a client could announce rsa-sha2-512 and sign with ssh-rsa (SHA-1) and the server accepted it; the delta adds the comparison and a regression test asserting both the rejection and that a matching signature is still accepted. One dependency is removed, not added: the legacy-ed25519-pkcs8-parser feature and its yasna ASN.1 dependency are gone, so the PKCS8 path no longer falls back to a second parser on error. This tree uses russh as a client with default features, so it never enabled that feature and is not exposed to the server-side bug; both changes are a reduction in attack surface for it. Partial-success auth now carries proceed_with_methods as an Option, removing password from the offered set when none is given, and resets partial_success per request. The remainder is mechanical: let-chain rewrites in keys/known_hosts.rs and kex/dh/mod.rs with identical semantics, saturating arithmetic for the cipher byte counter, and new integration tests. Source safety review, not a cryptographic audit."

[[audits.rustls]]
who = "Mykhailo Chalyi <mike@chaliy.name>"
criteria = "safe-to-deploy"
delta = "0.23.45 -> 0.23.46"
notes = "Reviewed the 2026-10-14 advisory delta (RUSTSEC-2026-0346 through -0349); every change narrows. The TLS 1.3 key-exchange hint moves out of handle_server_hello into ExpectFinished, so it is recorded only after cert_verified and sig_verified, not from an unauthenticated ServerHello. start_traffic now runs after the ECH-rejection check, and the std writer/flush paths return the connection's stored fatal error instead of buffering plaintext, so application data cannot reach the outer server after ECH rejection. Brotli certificate decompression switches to BrotliDecompressStream over a caller-supplied output slice with BrotliState::new_strict, rejecting large windows and trailing input instead of letting brotli::BrotliDecompress allocate; zlib switches to Inflate so total_in/total_out are checked against both slice lengths. Secret-bearing Debug derives on Tls13ClientSessionValue, ClientSessionCommon and ServerSessionValue become hand impls that destructure and skip the secret/master_secret fields, with finish_non_exhaustive and tests asserting the key bytes are absent. Supporting changes: LimitedCache evicts on an explicit max rather than VecDeque::capacity (eviction only, no bound raised), pre_encrypt_action uses >= so the hard limit is checked first, protected change_cipher_spec is rejected per RFC 9846 section 5, ECH hello-retry acceptance is recorded and enforced as final per RFC 9849, and the aws-lc-rs HPKE sealer/opener move from NonceSequence to LessSafeKey with an explicit compute_nonce plus increment_seq_num. No unsafe blocks added or changed, no new filesystem, network, process or environment access, no new dependencies, build.rs unchanged. Source safety review of the delta, not a cryptographic proof or a full crate review."

