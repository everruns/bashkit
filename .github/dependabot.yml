version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          # turso_core is BETA upstream — keep it as standalone PRs so each
          # bump (and its 30+ transitive crates) goes through manual review
          # rather than landing inside an aggregated `chore(deps)` PR.
          - "turso_core"
          - "turso_*"
          # monty is pre-1.0 and breaks its embedding API on most 0.0.x bumps
          # (0.0.19 dropped `max_allocations` and added a print-collect cap).
          # Keep it standalone so the builtin rewrite each bump needs is
          # reviewed on its own, not buried in an aggregated `chore(deps)` PR.
          - "monty"
          - "monty-*"
    # Surface turso bumps individually with a label that flags them for
    # extra scrutiny. The `groups` section above already excludes them
    # from the aggregated PR; no additional config needed here for
    # standalone delivery.
    ignore:
      # num-bigint is hard-pinned to 0.4.x in crates/bashkit-python: monty
      # (0.0.19) depends on num-bigint 0.4, and py_to_monty hands a
      # `num_bigint::BigInt` to `MontyObject::BigInt`. A 0.5 bump makes the two
      # BigInt types mismatch and fails to compile. Block major/minor jumps
      # (0.4 -> 0.5) while still allowing 0.4.x patch updates, until monty
      # upgrades upstream. See the pin comment in bashkit-python/Cargo.toml.
      - dependency-name: "num-bigint"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # monty/monty-types are held at 0.0.19 for a security reason, not just an
      # API-churn one. 0.0.21 replaced host-side memory accounting with a probe
      # of globals that only the `monty-alloc` global allocator writes, so an
      # embedder that cannot install a process-wide allocator — which bashkit,
      # as a library and a CPython extension module, cannot — silently loses the
      # Python sandbox's `max_memory` ceiling. Four threat-model regression
      # tests fail on the bump. Without these entries dependabot reopens the
      # same broken PR every week (#2296, #2297).
      # Drop the ignores once monty exposes an embedder-usable memory bound;
      # see knowledge/runtimes/python-builtin.md § Upgrade blocker.
      - dependency-name: "monty"
      - dependency-name: "monty-types"

      # idna_adapter is deliberately held at 1.0.0. It is not a normal
      # dependency: the crate exists so the top-level lockfile can choose
      # `idna`'s Unicode back end, and 1.0.x is the "no back end" stream that
      # keeps the 21-crate ICU4X stack out of the tree. Dependabot would read
      # the pin as staleness and bump it straight back to 1.2.x. See the
      # rationale comment above [patch.crates-io] in the root Cargo.toml.
      - dependency-name: "idna_adapter"

  # Fuzz targets are a separate cargo workspace with their own lockfile, so the
  # "/" entry above never touches them. Without this the fuzz lockfile silently
  # rots between releases (it drifted onto an unsound `anyhow` and two yanked
  # crates before CI started auditing it). Grouped into one PR — these are
  # build-time-only test dependencies, not shipped library code.
  - package-ecosystem: "cargo"
    directory: "/crates/bashkit/fuzz"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      fuzz-dependencies:
        patterns:
          - "*"

  # npm / pnpm.
  #
  # Important decision: the five pnpm lockfiles in this repo had no
  # `updates:` entry, so nothing kept them fresh — only the dependency graph
  # (which drives Dependabot *alerts* and security updates) saw them, and that
  # reacts to published advisories rather than to age. The practical cost is a
  # tree that drifts far enough behind that the eventual security bump is a
  # multi-major jump nobody can land quickly. One entry per lockfile below;
  # each is grouped so a week of bumps arrives as a single reviewable PR, the
  # same shape as the cargo entries above.
  #
  # `@everruns/*` is ignored everywhere: those are this repo's own published
  # packages, pinned to the workspace version (0.16.0) and bumped by the
  # release process (see knowledge/operations/release-process.md). Letting
  # dependabot move them independently races that process and produces PRs
  # that are wrong the moment a release lands.

  # The docs site — a deployed Cloudflare Worker, so its tree is the only npm
  # surface here that is reachable from the public internet at runtime.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@everruns/*"

  # Build and test toolchain for the published `@everruns/bashkit` napi
  # package. All devDependencies, but they run in CI and produce the artifact
  # that ships to npm, so they are supply chain, not just developer comfort.
  - package-ecosystem: "npm"
    directory: "/crates/bashkit-js"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      js-npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@everruns/*"

  # Example apps. Private (never published) but built by the Examples CI job,
  # so a rotted lockfile breaks CI rather than users. One entry covers all
  # three via `directories`, and they share a group so the weekly churn from
  # the fast-moving AI SDKs stays in a single PR.
  - package-ecosystem: "npm"
    directories:
      - "/examples"
      - "/examples/browser"
      - "/examples/bashkit-pi"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      examples-npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@everruns/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
