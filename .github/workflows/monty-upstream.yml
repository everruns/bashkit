name: Monty Upstream Watch

# The embedded python3 runs on renamed forks of Monty (crates/bashkit-monty,
# crates/bashkit-monty-types). cargo audit/deny and Dependabot match by crate
# name, so upstream `monty` releases and advisories never reach the forks.
# This job fails when upstream ships a newer stable release than the fork
# base, or when OSV lists an advisory affecting it. A red run means: re-sync
# the forks, or triage the advisory (ACKNOWLEDGED in the script).
# See knowledge/operations/dependencies.md.
#
# Not a PR check: it reads live crates.io/OSV state, which changes without
# any repository change, so it must not block unrelated PRs.

on:
  schedule:
    # Daily 06:17 UTC: advisories should surface within a day.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Upstream releases and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream Monty
        run: python3 scripts/check_monty_upstream.py
