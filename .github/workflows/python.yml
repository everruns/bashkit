# CI for bashkit Python package
# Builds the native extension via maturin and runs pytest on each PR.
# Complements publish-python.yml (release-only) with per-PR validation.

name: Python

on:
  push:
    branches: [main]
    paths:
      - "crates/bashkit-python/**"
      - "crates/bashkit/**"
      - "examples/*.py"
      - "examples/*.ipynb"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/bashkit-python/**"
      - "crates/bashkit/**"
      - "examples/*.py"
      - "examples/*.ipynb"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MATURIN_VERSION: ">=1.4,<2.0"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Ruff check
        run: uvx ruff check crates/bashkit-python

      - name: Ruff format
        run: uvx ruff format --check crates/bashkit-python

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Mypy type check
        run: |
          pip install mypy
          mypy crates/bashkit-python/bashkit/ --ignore-missing-imports

  # Run the full pytest suite on every targeted Python version. The bashkit
  # extension is abi3 (one cp39-abi3 wheel for all versions), so it is built
  # ONCE by build-wheel and downloaded here instead of rebuilt per leg. Only
  # the random-fs fixture — a separate, non-abi3 extension — is still built per
  # version. Covers 3.9–3.14 (the full abi3 support range).
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [build-wheel]
    # Pinned, not `ubuntu-latest`: Ubuntu 26.04 ships no hosted 3.9 build, and
    # `setup-python` has no fallback, so the 3.9 leg died the moment
    # `ubuntu-latest` began rolling onto it ("The version '3.9' with
    # architecture 'x64' was not found for Ubuntu 26.04"). The wheel is
    # cp39-abi3 and the package claims >=3.9, so the fix is an image that can
    # host the whole declared range, not a smaller matrix. Unpin when 3.9
    # support is dropped; `publish-python.yml`'s `test-builds` is pinned for
    # the same reason and the two matrices are kept in step by
    # `just check-workflow-parity`.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # The single abi3 wheel produced once by build-wheel; install it on each
      # version to prove one wheel runs across the whole 3.9–3.14 range.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-wheel
          path: crates/bashkit-python/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install maturin
        run: python -m pip install "maturin${MATURIN_VERSION}"

      - name: Install wheel and test dependencies
        run: |
          pip install bashkit --no-index --find-links crates/bashkit-python/dist --force-reinstall
          pip install pytest pytest-asyncio pytest-timeout langchain-core langgraph fastapi httpx maturin
          pip install uvloop

      - name: Install Deep Agents integration dependencies
        if: matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: pip install 'bashkit[deepagents]' --find-links crates/bashkit-python/dist

      # random-fs is a separate, non-abi3 pyo3 extension (own workspace, no
      # abi3-py39), so it must be built against each interpreter.
      - name: Build random filesystem fixture
        run: |
          python -m maturin build --release --out /tmp/bashkit-random-fs \
            -m crates/bashkit-python/test-fixtures/random-fs/Cargo.toml \
            -i python${{ matrix.python-version }}
          pip install bashkit-random-fs --no-index --find-links /tmp/bashkit-random-fs --force-reinstall

      - name: Run tests
        working-directory: crates/bashkit-python
        run: pytest tests/ -v --timeout=30 --timeout-method=thread

  # Loop ownership differs on Windows (Proactor) and Unix (Selector/uvloop).
  # Test the native callback bridge on each platform instead of relying only
  # on the Linux abi3 wheel matrix above. No random-FS fixture is needed here.
  callback-platforms:
    name: Callback loops (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build and install native wheel
        run: |
          python -m pip install "maturin${{ env.MATURIN_VERSION }}"
          python -m maturin build -m crates/bashkit-python/Cargo.toml --out dist
          python -m pip install bashkit --no-index --find-links dist
          python -m pip install pytest pytest-asyncio pytest-timeout langchain-core deepagents fastapi httpx
      - name: Install uvloop on Unix
        if: runner.os != 'Windows'
        run: python -m pip install uvloop
      - name: Test callback execution models
        run: >-
          python -m pytest --timeout=30 --timeout-method=thread
          crates/bashkit-python/tests/test_external_functions.py
          crates/bashkit-python/tests/test_typescript_external_functions.py
          crates/bashkit-python/tests/test_registered_tools.py
          crates/bashkit-python/tests/test_async_callbacks.py
          crates/bashkit-python/tests/test_jupyter_compat.py
          crates/bashkit-python/tests/test_teardown_determinism.py

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install maturin
        run: python -m pip install "maturin${MATURIN_VERSION}"

      - name: Build wheel
        working-directory: crates/bashkit-python
        run: python -m maturin build --release --out dist -i python3.12

      - name: Install local wheel
        run: |
          pip install bashkit --no-index --find-links crates/bashkit-python/dist --force-reinstall
          pip install langchain-core langgraph fastapi httpx uvicorn nbconvert jupyter-client ipykernel maturin

      - name: Build random filesystem fixture
        run: |
          python -m maturin build --release --out /tmp/bashkit-random-fs \
            -m crates/bashkit-python/test-fixtures/random-fs/Cargo.toml \
            -i python3.12
          pip install bashkit-random-fs --no-index --find-links /tmp/bashkit-random-fs --force-reinstall

      - name: Run examples
        run: |
          python crates/bashkit-python/examples/bash_basics.py
          python crates/bashkit-python/examples/custom_filesystem_interop.py
          python crates/bashkit-python/examples/k8s_orchestrator.py
          python crates/bashkit-python/examples/data_pipeline.py
          python crates/bashkit-python/examples/llm_tool.py
          python crates/bashkit-python/examples/langgraph_async_tool.py
          python crates/bashkit-python/examples/fastapi_async_tool.py

      - name: Run notebooks
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 \
            examples/jupyter_basics.ipynb --output /tmp/jupyter_basics_out.ipynb
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 \
            examples/runtime_external_functions.ipynb --output /tmp/runtime_external_functions_out.ipynb

  # Verify wheel builds and passes twine check
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install "maturin${MATURIN_VERSION}"

      - name: Build wheel
        working-directory: crates/bashkit-python
        run: python -m maturin build --release --out dist

      - name: Verify wheel metadata
        run: |
          pip install twine
          twine check crates/bashkit-python/dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-wheel
          path: crates/bashkit-python/dist
          retention-days: 5

  # Build the reduced-feature Pyodide/Emscripten wheel and smoke-test it in a
  # Pyodide venv. See knowledge/runtimes/emscripten-wheels.md for the feature matrix and the
  # pyodide-build <-> Emscripten <-> Python <-> Rust version lockstep.
  wasm:
    name: Build wheel (Pyodide/Emscripten)
    runs-on: ubuntu-latest
    env:
      # Pinned for reproducibility: this trio must stay aligned on the wasm
      # feature set + exception-handling ABI (see knowledge/runtimes/emscripten-wheels.md
      # "version triangle"). pyodide-build 0.34.x (under Python 3.13) selects
      # Pyodide 0.29.x / Emscripten 4.0.9; the nightly's LLVM must match that
      # binaryen. Bump all three together and re-verify the wheel imports.
      RUST_NIGHTLY: "nightly-2026-05-29"
      PYODIDE_BUILD_VERSION: "0.34.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python 3.13 selects pyodide-build's modern config (Pyodide 0.29.x,
      # Emscripten 4.0.9), whose binaryen understands the wasm target-features
      # modern LLVM emits and whose runtime supports wasm exception handling.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Pyodide passes `-Z link-native-libraries=no` (nightly-only). The nightly
      # must satisfy our deps' MSRV (monty needs rustc 1.95) and edition 2024,
      # so it has to be recent; its LLVM (19+) matches Emscripten 4.0.9's
      # binaryen, which is what avoids the wasm-opt target-feature skew that
      # older Emscripten (3.1.x) hit. See knowledge/runtimes/emscripten-wheels.md.
      - name: Install nightly Rust with the Emscripten target
        # @nightly matches the repo's other nightly jobs (fuzz.yml, nightly.yml,
        # ci.yml); the exact nightly is pinned via the toolchain: input below.
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: wasm32-unknown-emscripten

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # pyodide-build manages its own matching emsdk via the cross-build env, so
      # no separate setup-emsdk step is needed.
      - name: Install pyodide-build
        run: pip install "pyodide-build==${PYODIDE_BUILD_VERSION}"

      - name: Install pyodide cross-build environment
        run: pyodide xbuildenv install

      - name: Build Pyodide wheel
        working-directory: crates/bashkit-python
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
        run: pyodide build --outdir dist

      - name: Smoke test in a Pyodide venv
        working-directory: crates/bashkit-python
        # Run the import test from a scratch dir: the crate's own `bashkit/`
        # source package would otherwise shadow the installed extension module.
        run: |
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/pip install dist/*.whl
          venv_python="$(pwd)/.venv-pyodide/bin/python"
          cd "$(mktemp -d)"
          "$venv_python" -c "
          from bashkit import Bash
          b = Bash(python=True)
          r = b.execute_sync('echo hello && echo 1 | jq .')
          print(r.stdout)
          assert r.exit_code == 0, r
          assert r.stdout == 'hello\n1\n', r.stdout
          # Reduced-feature build: unavailable config must fail loudly.
          try:
              Bash(sqlite=True)
          except RuntimeError:
              pass
          else:
              raise AssertionError('expected sqlite=True to raise on wasm')
          print('wasm smoke test OK')
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-wheel-emscripten
          path: crates/bashkit-python/dist
          retention-days: 5

  # Gate job for branch protection
  python-check:
    name: Python Check
    if: always()
    needs: [lint, test, examples, build-wheel, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.examples.result }}" != "success" ]] || \
             [[ "${{ needs.build-wheel.result }}" != "success" ]] || \
             [[ "${{ needs.wasm.result }}" != "success" ]]; then
            echo "One or more Python CI jobs failed"
            exit 1
          fi
