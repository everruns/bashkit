name: Build native libs

on:
  workflow_dispatch:

jobs:
  test:
    name: capi tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: capi-tests

      - name: Run capi ABI tests
        run: cargo test --release -p bashkit-capi

  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            out: bashkit_capi.dll
            lib: bashkit.dll
            zig: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            out: libbashkit_capi.so
            lib: libbashkit.so
            zig: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            out: libbashkit_capi.so
            lib: libbashkit.so
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: osx-aarch64
            out: libbashkit_capi.dylib
            lib: libbashkit.dylib
            zig: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: osx-x86_64
            out: libbashkit_capi.dylib
            lib: libbashkit.dylib
            zig: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Set up Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release -p bashkit-capi --target ${{ matrix.target }}
          else
            cargo build --release -p bashkit-capi --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/${{ matrix.out }} dist/${{ matrix.artifact }}/${{ matrix.lib }}

      - uses: actions/upload-artifact@v4
        with:
          name: bashkit-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
