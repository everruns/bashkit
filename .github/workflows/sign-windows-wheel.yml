# Shared production signing path. No compiler or native import runs with OIDC.
# THREAT[TM-INF-035]: every caller must use an immutable main-reachable tag.
name: Sign Windows wheel

on:
  workflow_call:
    inputs:
      unsigned-artifact-name:
        type: string
        required: true
      signed-artifact-name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  sign:
    name: Sign Windows wheel
    runs-on: windows-latest
    timeout-minutes: 10
    environment: release-windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable tag source
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-signing-smoke-[0-9a-f]{12})?$ ]]; then
            echo "Signing requires a stable release or signing-smoke tag"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.unsigned-artifact-name }}
          path: unsigned-dist

      - name: Install wheel tooling
        run: >-
          python -m pip install --only-binary=:all: wheel==0.48.0

      - name: Unpack and retain unsigned file hashes
        id: unpack
        run: python scripts/windows_wheel.py prepare --source unsigned-dist --work wheel-work

      - name: Read public signing configuration
        id: config
        shell: pwsh
        run: |
          $config = Get-Content scripts/windows-signing.json -Raw | ConvertFrom-Json
          foreach ($key in @("tenant-id", "subscription-id", "client-id", "endpoint", "signing-account-name", "certificate-profile-name")) {
            $value = $config.PSObject.Properties[$key].Value
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match "[\r\n]") {
              throw "Invalid signing configuration: $key"
            }
            $name = $key.Replace("-", "_")
            "$name=$value" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Authenticate release signer with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ steps.config.outputs.client_id }}
          tenant-id: ${{ steps.config.outputs.tenant_id }}
          subscription-id: ${{ steps.config.outputs.subscription_id }}

      - name: Sign native files and timestamp
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ steps.config.outputs.endpoint }}
          signing-account-name: ${{ steps.config.outputs.signing_account_name }}
          certificate-profile-name: ${{ steps.config.outputs.certificate_profile_name }}
          files-folder: ${{ steps.unpack.outputs.root }}
          files-folder-filter: pyd,dll,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify every native signature
        shell: pwsh
        env:
          WHEEL_ROOT: ${{ steps.unpack.outputs.root }}
        run: ./scripts/verify_windows_signatures.ps1 -Root $env:WHEEL_ROOT

      - name: Repack with regenerated RECORD and verify archive hashes
        run: python scripts/windows_wheel.py repack --work wheel-work --output signed-dist

      - name: Extract the final archive for signature verification
        id: final
        run: python scripts/windows_wheel.py prepare --source signed-dist --work final-check

      - name: Verify signatures from the final wheel
        shell: pwsh
        env:
          WHEEL_ROOT: ${{ steps.final.outputs.root }}
        run: ./scripts/verify_windows_signatures.ps1 -Root $env:WHEEL_ROOT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.signed-artifact-name }}
          path: signed-dist

