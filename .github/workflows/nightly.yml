name: Nightly

# Heavy analysis jobs — too slow for every PR, run nightly instead.
on:
  schedule:
    # 4 AM UTC daily (after fuzz at 3 AM)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RG_VERSION: 15.1.0
  JQ_VERSION: 1.8.1

jobs:
  miri:
    name: Miri (${{ matrix.execution_plan && 'execution-plan' || 'interpreter' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        execution_plan: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (default toolchain)
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      # The action no longer accepts a `toolchain:` input (it installs
      # the rust-toolchain.toml toolchain), so install the pinned nightly
      # explicitly below.
      # Pinned: nightly 2026-10-31 (rustc f9ceb4a4d) fails to compile bashkit
      # (E0391 async-drop cycle on parser::ast::CommandList). Unpin once a
      # later nightly builds `cargo +nightly check -p bashkit --lib`.
      - name: Install Rust nightly with Miri
        run: rustup toolchain install nightly-2026-10-30 --profile minimal --component miri

      - name: Setup Miri
        run: cargo +nightly-2026-10-30 miri setup

      - name: Run Miri on library tests
        run: |
          cargo +nightly-2026-10-30 miri test --features="${{ matrix.execution_plan && 'bashkit/experimental_execution_plan' || '' }}" --lib -p bashkit -- \
            --test-threads=1 \
            test_parse_simple_command \
            test_parse_variable \
            test_parse_pipeline
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: Miri plan admission and storage lifetime
        if: matrix.execution_plan
        run: |
          cargo +nightly-2026-10-30 miri test --lib -p bashkit --features experimental_execution_plan -- \
            --test-threads=1 builder_reservation_outlives_buffer_destruction \
            declined_and_failed_compilation_refund_storage automatic_policy_skips_short_scripts
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: Miri owned jq storage and iterator lifetimes
        run: |
          cargo +nightly-2026-10-30 miri test -p bashkit --no-default-features --features experimental_jq --lib -- \
            --test-threads=1 refused_attachment_leaves_the_container_valid \
            failed_cow_does_not_copy_or_change_the_shared_body failed_object_growth_does_not_reserve_storage \
            removal_invalidates_depth_and_drop_refunds_storage owning_iterator_keeps_storage_charged_until_drop \
            collection_charges_capacity_before_advancing_the_iterator nested_meter_restores_poll_progress
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # CI audits lockfiles on push and PR only, so main goes unscanned for as long
  # as nobody pushes — and an advisory is published against code that has not
  # changed. This job re-runs the same scan daily against a fresh copy of the
  # RustSec database, so a new advisory surfaces within a day rather than
  # waiting for the next commit.
  advisories:
    name: Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      # Prebuilt binary rather than a source build: cargo-audit's own
      # dependencies resolve unlocked, and an MSRV bump in one of them past our
      # pinned toolchain broke this step once already in CI.
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit

      # pnpm (and the node it needs) for the npm half of the scan; the PyPI
      # half reads uv.lock with the stdlib. Neither needs an install step.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22.23.4"

      - name: Security audit (cargo, npm, PyPI)
        run: ./scripts/audit-lockfiles.sh

  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Built from source against the pinned toolchain, so the tool version is
      # pinned too: an unpinned tool resolves to the newest release, and
      # cargo-geiger 0.14.0 raised its MSRV to 1.97 on the day it shipped,
      # which broke this job on a tree that had not changed. Bump deliberately
      # alongside rust-toolchain.toml; 0.13.0 builds on 1.85+.
      #
      # The version belongs in `tool:` as `name@version`. This action has no
      # `version` input, and an unknown input is only a warning, so spelling it
      # that way silently installed the newest release anyway.
      - name: Install cargo-geiger
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3
        with:
          tool: cargo-geiger@0.13.0
          locked: true

      - name: Run cargo-geiger (unsafe code audit)
        shell: bash
        run: |
          # The JSON report exposes coverage gaps without failing just because
          # rustc's dependency files list data assets or generated sources.
          cargo geiger --manifest-path "$PWD/crates/bashkit/Cargo.toml" --locked --all-features --output-format Json > geiger-output.jsonl 2> geiger-diagnostics.txt || {
            scan_status=$?
            tail -n 50 geiger-diagnostics.txt >&2
            exit "$scan_status"
          }
          jq -s -e 'map(select(type == "object" and has("packages"))) | if length == 1 then .[0] else error("expected one Geiger report") end' geiger-output.jsonl > geiger-report.json
          # Geiger logs parser errors separately from its JSON metrics.
          if grep -F "Failed to parse file: $PWD/" geiger-diagnostics.txt >&2; then
            exit 1
          fi
          jq -e --arg build_dir "$PWD/target/debug/build/" '
            if any(.packages, .packages_without_metrics, .used_but_not_scanned_files; type != "array") then
              error("Geiger report is missing its package or file lists")
            elif (any(.packages[]; .package.id.name == "bashkit") | not) then
              error("Bashkit is missing from the Geiger report")
            elif (.packages_without_metrics | length) != 0 then
              error("Geiger did not report metrics for every package: \(.packages_without_metrics)")
            elif any(.used_but_not_scanned_files[]; endswith(".rs") and (startswith($build_dir) | not)) then
              error("Geiger did not scan checked-in Rust inputs; see used_but_not_scanned_files in the report")
            else
              "Geiger scanned \(.packages | length) packages. Report lists \(.used_but_not_scanned_files | length) unscanned build inputs."
            end' geiger-report.json

      - name: Upload geiger report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: geiger-report
          path: |
            geiger-*.json*
            geiger-diagnostics.txt
          retention-days: 30

  asan:
    name: AddressSanitizer (${{ matrix.execution_plan && 'execution-plan' || 'interpreter' }})
    # Pinned for the GNU coreutils oracle, like ci.yml's `test` job; see the
    # note there.
    runs-on: ubuntu-24.04
    # ASAN with --test-threads=1 plus the expanded rg/coreutils
    # differential corpora needs well over the previous 30-minute cap;
    # the last two nightly runs cancelled mid-suite at exactly 30 min.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        execution_plan: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `-Z build-std` rebuilds std + every dep + every bashkit test with
      # ASAN instrumentation. Target dir grows past the default runner's
      # ~14-21 GiB free volume; reclaim ~25 GiB of unused tooling first.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install Rust stable (default toolchain)
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      # The action no longer accepts a `toolchain:` input (it installs
      # the rust-toolchain.toml toolchain), so install the pinned nightly
      # explicitly below.
      # Pinned: nightly 2026-10-31 (rustc f9ceb4a4d) fails to compile bashkit
      # (E0391 async-drop cycle on parser::ast::CommandList). Unpin once a
      # later nightly builds `cargo +nightly check -p bashkit --lib`.
      - name: Install Rust nightly with rust-src for build-std
        run: rustup toolchain install nightly-2026-10-30 --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      # ASAN runs the Rust test suite, including the `rg` and `jq`
      # differential tests.
      - name: Install pinned ripgrep for differential tests
        run: scripts/install-ripgrep-ci.sh "$RG_VERSION"

      - name: Install pinned jq for differential tests
        run: scripts/install-jq-ci.sh "$JQ_VERSION"

      - name: Run tests with AddressSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=0"
        run: |
          cargo +nightly-2026-10-30 test --features="${{ matrix.execution_plan && 'bashkit/experimental_execution_plan' || '' }}" -Z build-std --target x86_64-unknown-linux-gnu --lib --tests \
            -- --test-threads=1

      - name: Run owned jq lifecycle and compatibility tests with AddressSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=0"
        run: |
          # The default ASan pass above owns the long throughput workloads
          # and strict 300-ms timeout test. Avoid running those twice in this
          # instrumented owned-container slice.
          cargo +nightly-2026-10-30 test --features="experimental_jq${{ matrix.execution_plan && ',experimental_execution_plan' || '' }}" \
            -Z build-std --target x86_64-unknown-linux-gnu -p bashkit --no-default-features --lib --test integration -- \
            --test-threads=1 jq yq \
            --skip growth_inside_one_evaluation_stops_at_the_limit \
            --skip non_emitting_loop_stops_at_the_timeout \
            --skip ordinary_workloads_still_fit \
            --skip unbounded_generator_is_capped

      # The default-feature run above leaves out embedded python3. The Monty
      # forks (crates/bashkit-monty*) are our code now, with unsafe in the
      # metered allocator and VM, so their tests get their own ASan pass.
      # The `python` filter also picks up python_tenant_stress_tests.
      - name: Run python3 (Monty) tests with AddressSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=0"
        run: |
          cargo +nightly-2026-10-30 test --features="${{ matrix.execution_plan && 'bashkit/experimental_execution_plan' || '' }}" -Z build-std --target x86_64-unknown-linux-gnu \
            -p bashkit --features python --lib --test integration -- --test-threads=1 python

      # The vendored ZapCode VM (crates/bashkit/src/zapcode_vendor) is our
      # code too, and ts runs under the same metered allocator. The filters
      # pick up the unit, threat-model, security and tenant stress tests (a
      # bare `ts` would match every `tests` module path).
      - name: Run ts (ZapCode) tests with AddressSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=0"
        run: |
          cargo +nightly-2026-10-30 test --features="${{ matrix.execution_plan && 'bashkit/experimental_execution_plan' || '' }}" -Z build-std --target x86_64-unknown-linux-gnu \
            -p bashkit --features typescript --lib --test integration -- --test-threads=1 \
            typescript threat_ts ts_tenant_stress zapcode

  python-stress-soak:
    name: Python multi-tenant stress soak (${{ matrix.execution_plan && 'execution-plan' || 'interpreter' }})
    # PR CI runs python_tenant_stress_tests at 3 rounds. The soak repeats
    # them many times in release mode so rare cross-tenant leaks (meter
    # left on a worker thread, budget not returned after an abandoned call)
    # show up. Re-sync checklist in knowledge/operations/dependencies.md.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        execution_plan: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Run stress soak
        env:
          BASHKIT_STRESS_ROUNDS: "300"
        run: |
          cargo test --features="${{ matrix.execution_plan && 'bashkit/experimental_execution_plan' || '' }}" --release -p bashkit --features python --test integration \
            -- python_tenant_stress

  ts-stress-soak:
    name: TypeScript multi-tenant stress soak (${{ matrix.execution_plan && 'execution-plan' || 'interpreter' }})
    # PR CI runs ts_tenant_stress_tests at 3 rounds. The soak repeats them in
    # release mode so rare cross-tenant leaks (meter left on a worker thread,
    # charge not released after an abandoned call) show up.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        execution_plan: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Run stress soak
        env:
          BASHKIT_STRESS_ROUNDS: "300"
        run: |
          cargo test --features="${{ matrix.execution_plan && 'bashkit/experimental_execution_plan' || '' }}" --release -p bashkit --features typescript --test integration \
            -- ts_tenant_stress
