name: Fuzz Testing

# Run fuzzing on schedule and manual trigger
# Fuzzing is too slow for every PR, so we run it nightly
on:
  schedule:
    # Run at 3 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration in seconds per target (positive integer)'
        required: false
        default: '300'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parser_fuzz, lexer_fuzz, analyze_fuzz, arithmetic_fuzz, glob_fuzz, cpython_fuzz, cpython_http_fuzz, python_fuzz, python_diff_fuzz, ts_fuzz]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (default toolchain)
        uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      # The action no longer accepts a `toolchain:` input (it installs
      # the rust-toolchain.toml toolchain), so install the pinned nightly
      # explicitly below.
      # Pinned: nightly 2026-10-31 (rustc f9ceb4a4d) fails to compile bashkit
      # (E0391 async-drop cycle on parser::ast::CommandList). Unpin once a
      # later nightly builds `cargo +nightly check -p bashkit --lib`.
      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-10-30 --profile minimal

      # On the nightly, not the pinned stable default: an unpinned source
      # build on a pinned toolchain breaks when upstream raises its MSRV.
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-30 install cargo-fuzz --locked

      - name: Cache fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: crates/bashkit/fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer - ${{ matrix.target }}
        working-directory: crates/bashkit
        env:
          DURATION_INPUT: ${{ github.event.inputs.duration || '300' }}
        run: |
          # Validate duration is a positive integer before use (prevents shell injection
          # from workflow_dispatch inputs being interpolated directly into the shell).
          # ^[1-9][0-9]*$ rejects 0, negatives, and leading zeros (avoids bash octal
          # arithmetic ambiguity, e.g. "09" would error on -eq comparisons).
          if ! [[ "$DURATION_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::duration must be a positive integer with no leading zeros, got: $DURATION_INPUT"
            exit 1
          fi
          features=()
          case "${{ matrix.target }}" in
            python_diff_fuzz) features=(--features python,cpython) ;;
            cpython_*) features=(--features cpython) ;;
            python_*) features=(--features python) ;;
            ts_fuzz) features=(--features typescript) ;;
          esac
          cargo +nightly-2026-10-30 fuzz run "${features[@]}" ${{ matrix.target }} -- \
            -max_total_time="$DURATION_INPUT" \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            crates/bashkit/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
